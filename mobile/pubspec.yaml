name: karigar
description: "Karigar AI - Pakistan's Smart Service Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Utils ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  http: ^1.6.0

  # ── Media & Location ────────────────────────────────────────
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # ── Map ─────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.9.0

  # ── Supabase ────────────────────────────────────────────────
  supabase_flutter: ^2.5.0

  # ── Voice ───────────────────────────────────────────────────
  record: ^5.2.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/karigar_logo.png"


flutter_native_splash:
  color: "#0B2D2A"
  image: "assets/images/karigar_logo.png"
  android: true
  ios: true

